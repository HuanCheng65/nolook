[project]
name = "nolook"
version = "0.4.0"
description = "Drive an Android device or a web page by what is on screen, not by screenshots. Built for coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HuanCheng65" }]
keywords = ["android", "adb", "uiautomator", "web", "chrome-devtools", "ai-agents", "claude-code", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = ["uiautomator2>=3.7", "pillow>=10", "numpy>=1.26", "perfetto>=0.50", "websockets>=13"]

[project.urls]
Homepage = "https://github.com/HuanCheng65/nolook"
Issues = "https://github.com/HuanCheng65/nolook/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nolook = "nolook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["evals", ".venv", "dist"]
